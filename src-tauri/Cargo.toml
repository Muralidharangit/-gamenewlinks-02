[package]
name = "winbet-smart-pc"
version = "1.0.0"
description = "WinBet Smart PC Gaming Terminal"
authors = ["WinBet Gaming Central"]
license = "Proprietary"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
